version: "3.8"

services:
  ecclesia-db:
    image: postgres:16-alpine
    container_name: ecclesia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecclesia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecclesia_secure_pass_2026}
      POSTGRES_DB: ecclesia
    volumes:
      - ecclesia_pgdata:/var/lib/postgresql/data
    networks:
      - pi-cms-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecclesia"]
      interval: 10s
      timeout: 5s
      retries: 5

  pi-cms-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pi-cms-app
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: postgresql://ecclesia:${POSTGRES_PASSWORD:-ecclesia_secure_pass_2026}@ecclesia-db:5432/ecclesia?schema=public
      SHADOW_DATABASE_URL: postgresql://ecclesia:${POSTGRES_PASSWORD:-ecclesia_secure_pass_2026}@ecclesia-db:5432/ecclesia_shadow?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://162.35.104.28}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-ecclesia_nextauth_secret_2026_change_me}
      NODE_ENV: production
      # Firebase
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-pi-cms-2025}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:-}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      # AI
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4}
      # Email
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      # Payments
      FLUTTERWAVE_PUBLIC_KEY: ${FLUTTERWAVE_PUBLIC_KEY:-}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      FLUTTERWAVE_SECRET_HASH: ${FLUTTERWAVE_SECRET_HASH:-}
    volumes:
      - ecclesia_uploads:/app/uploads
    depends_on:
      ecclesia-db:
        condition: service_healthy
    networks:
      - pi-cms-net

volumes:
  ecclesia_pgdata:
  ecclesia_uploads:

networks:
  pi-cms-net:
    driver: bridge
