<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbf7"/>
      <stop offset="60%" stop-color="#fff4ec"/>
      <stop offset="100%" stop-color="#fdecd0"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e31e24"/>
      <stop offset="100%" stop-color="#f7931e"/>
    </linearGradient>
    <linearGradient id="brandSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8286e"/>
      <stop offset="100%" stop-color="#f7931e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#15161a" flood-opacity="0.10"/>
    </filter>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#15161a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="540" fill="url(#bg)" rx="16"/>

  <!-- Large soft circle behind -->
  <circle cx="650" cy="180" r="220" fill="#fff" opacity="0.55"/>

  <!-- Church interior silhouette -->
  <g opacity="0.18" transform="translate(360, 60)">
    <!-- Cross -->
    <rect x="172" y="0" width="16" height="110" fill="#5b5c63" rx="2"/>
    <rect x="136" y="30" width="88" height="16" fill="#5b5c63" rx="2"/>
    <!-- Window frames -->
    <rect x="40" y="80" width="34" height="180" rx="17" fill="#9b9a94" opacity="0.5"/>
    <rect x="286" y="80" width="34" height="180" rx="17" fill="#9b9a94" opacity="0.5"/>
  </g>

  <!-- Congregation silhouettes -->
  <g transform="translate(140, 320)" opacity="0.16">
    <circle cx="30" cy="0" r="22" fill="#5b5c63"/>
    <path d="M0 80 Q30 10 60 80 L60 110 Q30 100 0 110 Z" fill="#5b5c63"/>
  </g>
  <g transform="translate(220, 335)" opacity="0.13">
    <circle cx="24" cy="0" r="18" fill="#5b5c63"/>
    <path d="M0 60 Q24 10 48 60 L48 85 Q24 78 0 85 Z" fill="#5b5c63"/>
  </g>
  <g transform="translate(500, 315)" opacity="0.16">
    <circle cx="28" cy="0" r="20" fill="#5b5c63"/>
    <path d="M0 70 Q28 10 56 70 L56 100 Q28 92 0 100 Z" fill="#5b5c63"/>
  </g>
  <g transform="translate(580, 330)" opacity="0.13">
    <circle cx="24" cy="0" r="18" fill="#5b5c63"/>
    <path d="M0 60 Q24 10 48 60 L48 85 Q24 78 0 85 Z" fill="#5b5c63"/>
  </g>

  <!-- Laptop -->
  <g transform="translate(120, 110)" filter="url(#shadow)">
    <!-- Laptop base -->
    <rect x="0" y="270" width="520" height="18" rx="9" fill="#d6d2cb"/>
    <rect x="10" y="270" width="500" height="16" rx="8" fill="#b8b3ab"/>
    <!-- Screen bezel -->
    <rect x="10" y="0" width="500" height="280" rx="16" fill="#2a2a2a"/>
    <rect x="20" y="10" width="480" height="260" rx="8" fill="#fff"/>

    <!-- Dashboard UI -->
    <!-- Sidebar -->
    <rect x="20" y="10" width="90" height="260" rx="8" fill="#faf9f7"/>
    <rect x="20" y="10" width="90" height="40" rx="8" fill="#fff"/>
    <circle cx="50" cy="30" r="10" fill="url(#brand)" opacity="0.9"/>
    <rect x="38" y="70" width="54" height="8" rx="4" fill="#f3f1ea"/>
    <rect x="38" y="88" width="36" height="8" rx="4" fill="url(#brand)" opacity="0.15"/>
    <rect x="38" y="112" width="44" height="6" rx="3" fill="#e6e2d8"/>
    <rect x="38" y="128" width="44" height="6" rx="3" fill="#e6e2d8"/>
    <rect x="38" y="144" width="44" height="6" rx="3" fill="#e6e2d8"/>
    <rect x="38" y="160" width="44" height="6" rx="3" fill="#e6e2d8"/>
    <rect x="38" y="176" width="44" height="6" rx="3" fill="#e6e2d8"/>
    <rect x="38" y="192" width="44" height="6" rx="3" fill="#e6e2d8"/>

    <!-- Top bar -->
    <rect x="110" y="10" width="390" height="50" rx="0" fill="#fff"/>
    <text x="130" y="42" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#15161a">Good Morning!</text>
    <text x="130" y="58" font-family="system-ui, sans-serif" font-size="9" fill="#9b9a94">Here's what's happening in your church today.</text>
    <circle cx="465" cy="35" r="14" fill="#f3f1ea"/>

    <!-- Stats cards -->
    <rect x="130" y="75" width="100" height="60" rx="10" fill="#fff" stroke="#e6e2d8" stroke-width="1"/>
    <circle cx="150" cy="100" r="10" fill="url(#brandSoft)" opacity="0.15"/>
    <text x="150" y="104" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#e31e24" text-anchor="middle">328</text>
    <text x="150" y="124" font-family="system-ui, sans-serif" font-size="9" fill="#5b5c63" text-anchor="middle">Members</text>

    <rect x="245" y="75" width="100" height="60" rx="10" fill="#fff" stroke="#e6e2d8" stroke-width="1"/>
    <circle cx="265" cy="100" r="10" fill="url(#brandSoft)" opacity="0.15"/>
    <text x="265" y="104" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#e31e24" text-anchor="middle">$12.4K</text>
    <text x="265" y="124" font-family="system-ui, sans-serif" font-size="9" fill="#5b5c63" text-anchor="middle">Total Giving</text>

    <rect x="360" y="75" width="120" height="60" rx="10" fill="#fff" stroke="#e6e2d8" stroke-width="1"/>
    <circle cx="380" cy="100" r="10" fill="url(#brandSoft)" opacity="0.15"/>
    <text x="380" y="104" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#e31e24" text-anchor="middle">5</text>
    <text x="380" y="124" font-family="system-ui, sans-serif" font-size="9" fill="#5b5c63" text-anchor="middle">Upcoming Events</text>

    <!-- Recent Activity list -->
    <rect x="130" y="150" width="225" height="110" rx="10" fill="#fff" stroke="#e6e2d8" stroke-width="1"/>
    <text x="145" y="175" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#15161a">Recent Activity</text>
    <circle cx="145" cy="195" r="5" fill="#f7931e" opacity="0.6"/>
    <rect x="158" y="192" width="100" height="6" rx="3" fill="#f3f1ea"/>
    <rect x="158" y="202" width="70" height="4" rx="2" fill="#e6e2d8"/>
    <circle cx="145" cy="220" r="5" fill="#e31e24" opacity="0.6"/>
    <rect x="158" y="217" width="110" height="6" rx="3" fill="#f3f1ea"/>
    <rect x="158" y="227" width="60" height="4" rx="2" fill="#e6e2d8"/>
    <circle cx="145" cy="245" r="5" fill="#2fae66" opacity="0.6"/>
    <rect x="158" y="242" width="90" height="6" rx="3" fill="#f3f1ea"/>
    <rect x="158" y="252" width="55" height="4" rx="2" fill="#e6e2d8"/>

    <!-- Upcoming Events -->
    <rect x="370" y="150" width="110" height="110" rx="10" fill="#fff" stroke="#e6e2d8" stroke-width="1"/>
    <text x="385" y="175" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#15161a">Upcoming</text>
    <rect x="385" y="188" width="26" height="26" rx="6" fill="#f3f1ea"/>
    <text x="398" y="205" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#e31e24" text-anchor="middle">14</text>
    <rect x="420" y="192" width="40" height="5" rx="2.5" fill="#f3f1ea"/>
    <rect x="420" y="201" width="30" height="4" rx="2" fill="#e6e2d8"/>
    <rect x="385" y="222" width="26" height="26" rx="6" fill="#f3f1ea"/>
    <text x="398" y="239" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#e31e24" text-anchor="middle">17</text>
    <rect x="420" y="226" width="40" height="5" rx="2.5" fill="#f3f1ea"/>
    <rect x="420" y="235" width="30" height="4" rx="2" fill="#e6e2d8"/>
  </g>

  <!-- Phone -->
  <g transform="translate(545, 155)" filter="url(#phoneShadow)">
    <rect x="0" y="0" width="120" height="240" rx="18" fill="#1a1a1a"/>
    <rect x="6" y="6" width="108" height="228" rx="14" fill="#fff"/>
    <!-- Notch -->
    <rect x="38" y="6" width="44" height="14" rx="7" fill="#1a1a1a"/>
    <!-- App header -->
    <rect x="6" y="25" width="108" height="45" rx="0" fill="#faf9f7"/>
    <text x="18" y="48" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#15161a">Welcome!</text>
    <circle cx="95" cy="47" r="9" fill="#f3f1ea"/>
    <!-- Menu items -->
    <rect x="18" y="85" width="84" height="24" rx="6" fill="#fff" stroke="#e6e2d8" stroke-width="1"/>
    <circle cx="30" cy="97" r="6" fill="url(#brand)" opacity="0.85"/>
    <rect x="42" y="94" width="40" height="5" rx="2.5" fill="#f3f1ea"/>
    <rect x="18" y="117" width="84" height="24" rx="6" fill="#fff" stroke="#e6e2d8" stroke-width="1"/>
    <circle cx="30" cy="129" r="6" fill="#f7931e" opacity="0.7"/>
    <rect x="42" y="126" width="40" height="5" rx="2.5" fill="#f3f1ea"/>
    <rect x="18" y="149" width="84" height="24" rx="6" fill="#fff" stroke="#e6e2d8" stroke-width="1"/>
    <circle cx="30" cy="161" r="6" fill="#2fae66" opacity="0.7"/>
    <rect x="42" y="158" width="40" height="5" rx="2.5" fill="#f3f1ea"/>
    <rect x="18" y="181" width="84" height="24" rx="6" fill="#fff" stroke="#e6e2d8" stroke-width="1"/>
    <circle cx="30" cy="193" r="6" fill="#e31e24" opacity="0.7"/>
    <rect x="42" y="190" width="40" height="5" rx="2.5" fill="#f3f1ea"/>
  </g>

  <!-- Decorative accents -->
  <circle cx="90" cy="90" r="5" fill="#e31e24" opacity="0.2"/>
  <circle cx="730" cy="460" r="6" fill="#f7931e" opacity="0.2"/>
  <circle cx="760" cy="100" r="4" fill="#e31e24" opacity="0.15"/>
</svg>
