<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8f3"/>
      <stop offset="100%" stop-color="#fdecd0"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef5ed"/>
      <stop offset="100%" stop-color="#dbebdc"/>
    </linearGradient>
    <linearGradient id="brand-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8286e"/>
      <stop offset="100%" stop-color="#f7931e"/>
    </linearGradient>
    <linearGradient id="brand-warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e31e24"/>
      <stop offset="100%" stop-color="#f7931e"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#15161a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="420" fill="url(#sky)" rx="16"/>

  <!-- Sun -->
  <circle cx="500" cy="80" r="36" fill="#f7931e" opacity="0.18"/>
  <circle cx="500" cy="80" r="24" fill="#f7931e" opacity="0.28"/>
  <circle cx="500" cy="80" r="12" fill="#f7931e" opacity="0.45"/>

  <!-- Clouds -->
  <ellipse cx="120" cy="90" rx="42" ry="16" fill="#fff" opacity="0.9"/>
  <ellipse cx="145" cy="96" rx="30" ry="12" fill="#fff" opacity="0.85"/>
  <ellipse cx="390" cy="68" rx="36" ry="13" fill="#fff" opacity="0.85"/>

  <!-- Distant hills/trees -->
  <path d="M0 340 Q120 290 260 330 T600 320 V420 H0 Z" fill="#e6f0e5" opacity="0.6"/>
  <path d="M0 360 Q160 315 340 350 T600 345 V420 H0 Z" fill="url(#grass)"/>

  <!-- Church building -->
  <g transform="translate(210, 120)" filter="url(#soft-shadow)">
    <!-- Main building -->
    <rect x="20" y="80" width="140" height="150" rx="4" fill="#fff" stroke="#e6e2d8" stroke-width="1.5"/>
    <!-- Roof -->
    <path d="M10 85 L90 10 L170 85 Z" fill="#f7f5f0" stroke="#e6e2d8" stroke-width="1.5"/>
    <!-- Steeple/tower -->
    <rect x="70" y="0" width="40" height="90" fill="#fff" stroke="#e6e2d8" stroke-width="1.5"/>
    <path d="M60 5 L90 -55 L120 5 Z" fill="url(#brand-warm)" opacity="0.92"/>
    <!-- Cross -->
    <rect x="88" y="-46" width="4" height="28" fill="#fff" rx="1"/>
    <rect x="80" y="-38" width="20" height="4" fill="#fff" rx="1"/>
    <!-- Door -->
    <rect x="75" y="165" width="30" height="65" rx="15" fill="url(#brand-warm)" opacity="0.12" stroke="url(#brand-warm)" stroke-width="1.5"/>
    <!-- Windows -->
    <rect x="40" y="120" width="22" height="45" rx="11" fill="#f3f1ea"/>
    <rect x="118" y="120" width="22" height="45" rx="11" fill="#f3f1ea"/>
    <circle cx="90" cy="55" r="12" fill="#f3f1ea"/>
    <!-- Steps -->
    <rect x="55" y="230" width="70" height="8" rx="2" fill="#e6e2d8"/>
    <rect x="45" y="238" width="90" height="8" rx="2" fill="#e6e2d8"/>
  </g>

  <!-- People silhouettes (community) -->
  <g transform="translate(100, 310)" fill="#5b5c63" opacity="0.75">
    <circle cx="15" cy="0" r="10"/>
    <path d="M0 45 Q15 5 30 45 L30 60 Q15 55 0 60 Z"/>
  </g>
  <g transform="translate(135, 315)" fill="#5b5c63" opacity="0.6">
    <circle cx="12" cy="0" r="9"/>
    <path d="M0 40 Q12 8 24 40 L24 55 Q12 50 0 55 Z"/>
  </g>
  <g transform="translate(425, 310)" fill="#5b5c63" opacity="0.75">
    <circle cx="15" cy="0" r="10"/>
    <path d="M0 45 Q15 5 30 45 L30 60 Q15 55 0 60 Z"/>
  </g>
  <g transform="translate(460, 318)" fill="#5b5c63" opacity="0.6">
    <circle cx="12" cy="0" r="9"/>
    <path d="M0 40 Q12 8 24 40 L24 55 Q12 50 0 55 Z"/>
  </g>

  <!-- Floating UI cards (subtle, branded) -->
  <g transform="translate(40, 110)" filter="url(#soft-shadow)">
    <rect width="120" height="72" rx="12" fill="#fff" stroke="#e6e2d8" stroke-width="1"/>
    <circle cx="20" cy="20" r="8" fill="url(#brand-warm)" opacity="0.85"/>
    <rect x="38" y="16" width="60" height="8" rx="4" fill="#f3f1ea"/>
    <rect x="20" y="40" width="80" height="20" rx="4" fill="#f3f1ea"/>
    <rect x="20" y="40" width="52" height="20" rx="4" fill="url(#brand-warm)" opacity="0.15"/>
  </g>

  <g transform="translate(440, 140)" filter="url(#soft-shadow)">
    <rect width="120" height="72" rx="12" fill="#fff" stroke="#e6e2d8" stroke-width="1"/>
    <rect x="16" y="14" width="88" height="8" rx="4" fill="#f3f1ea"/>
    <rect x="16" y="30" width="40" height="6" rx="3" fill="#f3f1ea"/>
    <rect x="16" y="44" width="88" height="14" rx="4" fill="#f3f1ea"/>
    <rect x="16" y="44" width="64" height="14" rx="4" fill="url(#brand-warm)" opacity="0.15"/>
  </g>

  <!-- Accent shapes -->
  <circle cx="60" cy="350" r="4" fill="#e31e24" opacity="0.35"/>
  <circle cx="540" cy="360" r="4" fill="#f7931e" opacity="0.35"/>
  <circle cx="520" cy="80" r="3" fill="#e31e24" opacity="0.25"/>
</svg>
