version: "3.8"

services:
  pi-cms-db:
    image: postgres:16-alpine
    container_name: pi-cms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: picms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-picms_secure_pass_2026}
      POSTGRES_DB: picms
    volumes:
      - pi_cms_pgdata:/var/lib/postgresql/data
    networks:
      - pi-cms-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picms"]
      interval: 10s
      timeout: 5s
      retries: 5

  pi-cms-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pi-cms-app
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: postgresql://picms:${POSTGRES_PASSWORD:-picms_secure_pass_2026}@pi-cms-db:5432/picms?schema=public
      SHADOW_DATABASE_URL: postgresql://picms:${POSTGRES_PASSWORD:-picms_secure_pass_2026}@pi-cms-db:5432/picms_shadow?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://pisairtelcms.com}
      JITSI_PUBLIC_URL: ${JITSI_PUBLIC_URL:-https://meet.jit.si}
      JITSI_APP_ID: ${JITSI_APP_ID:-pisairtelcms}
      JITSI_APP_SECRET: ${JITSI_APP_SECRET:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-picms_nextauth_secret_2026_change_me}
      # Optional Cloudflare R2 storage. When all four values are set,
      # StorageService uses R2 for every upload; otherwise it uses the VPS volume.
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-pisairtel}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      NODE_ENV: production
      # AI
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4}
      # Email (Brevo preferred)
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-}
      BREVO_FROM_NAME: ${BREVO_FROM_NAME:-}
      # Legacy providers still supported as fallbacks
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      # Payments
      FLUTTERWAVE_PUBLIC_KEY: ${FLUTTERWAVE_PUBLIC_KEY:-}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      FLUTTERWAVE_SECRET_HASH: ${FLUTTERWAVE_SECRET_HASH:-}
    volumes:
      - pi_cms_uploads:/app/uploads
    depends_on:
      pi-cms-db:
        condition: service_healthy
    networks:
      - pi-cms-net

volumes:
  pi_cms_pgdata:
  pi_cms_uploads:

networks:
  pi-cms-net:
    driver: bridge
